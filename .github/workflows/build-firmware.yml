name: Build Firmware

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release from this build"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag for manual publish, e.g. 0.1.1 or v1.1.0-qol"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Compile Arduino sketches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install M5Stack ESP32 board support
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32

      - name: Install libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "M5Cardputer"
          arduino-cli lib install "M5GFX"

      - name: Detect Cardputer FQBN
        id: fqbn
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_FQBN="m5stack:esp32:m5stack_cardputer"
          if arduino-cli board details -b "$DEFAULT_FQBN" >/dev/null 2>&1; then
            echo "fqbn=$DEFAULT_FQBN" >> "$GITHUB_OUTPUT"
            echo "Using FQBN: $DEFAULT_FQBN"
            exit 0
          fi

          DETECTED_FQBN="$(arduino-cli board listall | awk 'BEGIN{IGNORECASE=1} /cardputer/ {print $NF; exit}')"
          if [ -z "$DETECTED_FQBN" ]; then
            echo "Could not detect a Cardputer FQBN from arduino-cli board listall." >&2
            arduino-cli board listall >&2
            exit 1
          fi

          echo "fqbn=$DETECTED_FQBN" >> "$GITHUB_OUTPUT"
          echo "Using detected FQBN: $DETECTED_FQBN"

      - name: Compile firmware
        shell: bash
        run: |
          set -euo pipefail
          FQBN="${{ steps.fqbn.outputs.fqbn }}"
          mkdir -p build/sketches dist

          mapfile -t SKETCHES < <(find firmware -type f -name "*.ino" | sort)
          if [ "${#SKETCHES[@]}" -eq 0 ]; then
            echo "No .ino files found under firmware/." >&2
            exit 1
          fi

          for sketch in "${SKETCHES[@]}"; do
            name="$(basename "$sketch" .ino)"
            src_dir="$(dirname "$sketch")"
            work_dir="build/sketches/$name"
            out_dir="$PWD/dist/$name"

            rm -rf "$work_dir" "$out_dir"
            mkdir -p "$work_dir" "$out_dir"

            # Keep Arduino's sketch-folder rule even if the repository layout changes.
            cp -R "$src_dir"/. "$work_dir"/
            cp "$sketch" "$work_dir/$name.ino"

            echo "Compiling $sketch"
            arduino-cli compile \
              --fqbn "$FQBN" \
              --warnings all \
              --output-dir "$out_dir" \
              "$work_dir"
          done

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" && -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package full firmware archive
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 3 -type f -print | sort
          mkdir -p release
          (cd dist && zip -r ../release/DONUT.OS-full.zip .)

      - name: Prepare release assets
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.tag }}"

          mapfile -t merged_candidates < <(find dist -type f \( -name "*.merged.bin" -o -name "*merged*.bin" \) | sort)
          if [ "${#merged_candidates[@]}" -eq 0 ]; then
            echo "No merged firmware binary found." >&2
            find dist -type f -print >&2
            exit 1
          fi

          declare -A used_variants=()
          for file in "${merged_candidates[@]}"; do
            variant="$(basename "$(dirname "$file")")"
            if [ "$variant" = "dist" ] || [ -z "$variant" ]; then
              variant="$(basename "$file" .merged.bin)"
              variant="${variant%.ino}"
            fi

            # Keep filenames portable and deterministic.
            variant="$(printf '%s' "$variant" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
            if [ -z "$variant" ]; then
              variant="firmware"
            fi

            if [ -n "${used_variants[$variant]:-}" ]; then
              echo "Duplicate merged binary variant detected: $variant" >&2
              echo "Existing: ${used_variants[$variant]}" >&2
              echo "New: $file" >&2
              exit 1
            fi
            used_variants[$variant]="$file"

            out="DONUT.OS-${tag}-${variant}.bin"
            echo "Using release binary for ${variant}: $file"
            cp "$file" "release/$out"
            (cd release && zip "DONUT.OS-${tag}-${variant}.zip" "$out")
          done

          cp "release/DONUT.OS-full.zip" "release/DONUT.OS-${tag}-full.zip"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: donut-os-firmware-${{ github.sha }}
          path: |
            dist/**/*.bin
            dist/**/*.elf
            dist/**/*.map
            release/DONUT.OS-full.zip
            release/DONUT.OS-*.bin
            release/DONUT.OS-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DONUT.OS ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, 'qol') }}
          generate_release_notes: true
          files: |
            release/DONUT.OS-${{ steps.release_tag.outputs.tag }}-*.bin
            release/DONUT.OS-${{ steps.release_tag.outputs.tag }}-*.zip
